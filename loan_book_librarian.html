{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Loan Book{% endblock %}
{% block content %}
<h1>Loan a Book</h1>
<p>The due date will be set to four weeks from today.</p>
<form method="post" class="form-card">{% csrf_token %}{{ form|crispy }}<button class="btn btn-primary" type="submit">Submit loan</button> <a class="btn btn-outline-secondary" href="{% url 'all_available' %}">Cancel</a></form>
{% endblock %}
