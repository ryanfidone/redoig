{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Create an Account{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-6">
  <h1>Create an Account</h1>
  <form method="post" class="form-card">{% csrf_token %}{{ form|crispy }}<button class="btn btn-success" type="submit">Register</button></form>
  <p class="mt-3"><strong>Already have an account?</strong> <a href="{% url 'login' %}">Log in now</a>.</p>
</div></div>
{% endblock %}
